spring.datasource.url=jdbc:postgresql://localhost:5432/casedesk
spring.datasource.username=casedesk
spring.datasource.password=casedesk

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# We use our own JWT login, so turn off Spring's default generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=8080
server.error.include-message=always

app.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-32bytes!!}
app.jwt.ttl-minutes=480

app.admin.username=admin
app.admin.password=admin123

# uploads: the screen promises 10 MB per file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
