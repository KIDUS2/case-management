spring.datasource.url=jdbc:postgresql://localhost:5432/casedesk
spring.datasource.username=casedesk
spring.datasource.password=casedesk

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# We use our own JWT login, so turn off Spring's default generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=8080
server.error.include-message=always

app.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-32bytes!!}
app.jwt.ttl-minutes=480

app.admin.username=admin
app.admin.password=admin123


# ---- Text messages (SMS) ----
# "log" only writes the message to the server log (safe default). Set to "http" and fill in the provider
# details (for example the Ethio Telecom SMS gateway) to send real messages.
app.sms.mode=${SMS_MODE:log}
app.sms.url=${SMS_URL:}
app.sms.username=${SMS_USERNAME:}
app.sms.password=${SMS_PASSWORD:}
app.sms.sender=${SMS_SENDER:ChurchDesk}
# {to}, {from} and {message} are filled in for every message; change this to match the provider's format.
app.sms.body-template=${SMS_BODY_TEMPLATE:}
app.sms.content-type=${SMS_CONTENT_TYPE:application/json}

# ---- Email ----
# "log" only writes the email to the server log (safe default). Set MAIL_MODE=smtp and fill in the mail server below
# (for example Gmail: smtp.gmail.com, port 587, an app password) to send real emails.
app.mail.mode=${MAIL_MODE:log}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---- Automatic backups ----
# Every night at 02:00 (Addis Ababa time) the database (pg_dump) and the uploaded documents are saved to app.backup.dir.
# Set BACKUP_COPY_TO to a USB disk or network folder to keep a second copy away from this computer.
# pg_dump must be installed (PostgreSQL client tools); set BACKUP_PG_DUMP to its full path if it is not on the PATH.
app.backup.enabled=${BACKUP_ENABLED:true}
app.backup.dir=${BACKUP_DIR:./backups}
app.backup.copy-to=${BACKUP_COPY_TO:}
app.backup.keep-days=${BACKUP_KEEP_DAYS:30}
app.backup.cron=${BACKUP_CRON:0 0 2 * * *}
app.backup.pg-dump=${BACKUP_PG_DUMP:pg_dump}
