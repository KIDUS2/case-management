spring.datasource.url=jdbc:postgresql://localhost:5432/casedesk
spring.datasource.username=casedesk
spring.datasource.password=casedesk

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# We use our own JWT login, so turn off Spring's default generated password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=8080
server.error.include-message=always

app.jwt.secret=${JWT_SECRET:change-me-please-change-me-please-32bytes!!}
app.jwt.ttl-minutes=480

app.admin.username=admin
app.admin.password=admin123


# ---- Text messages (SMS) ----
# "log" only writes the message to the server log (safe default). Set to "http" and fill in the provider
# details (for example the Ethio Telecom SMS gateway) to send real messages.
app.sms.mode=${SMS_MODE:log}
app.sms.url=${SMS_URL:}
app.sms.username=${SMS_USERNAME:}
app.sms.password=${SMS_PASSWORD:}
app.sms.sender=${SMS_SENDER:ChurchDesk}
# {to}, {from} and {message} are filled in for every message; change this to match the provider's format.
app.sms.body-template=${SMS_BODY_TEMPLATE:}
app.sms.content-type=${SMS_CONTENT_TYPE:application/json}
